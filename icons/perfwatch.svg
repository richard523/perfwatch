<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="#1e1e2e"/>

  <!-- Heartbeat/activity line representing performance monitoring -->
  <polyline points="32,160 64,160 72,160 80,80 88,200 96,120 104,140 112,140 144,140 152,60 160,210 168,130 176,140 224,140"
            fill="none" stroke="#89b4fa" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Memory bar -->
  <rect x="32" y="190" width="140" height="10" rx="3" fill="#313244"/>
  <rect x="32" y="190" width="95" height="10" rx="3" fill="#a6e3a1"/>

  <!-- CPU indicator -->
  <rect x="190" y="190" width="34" height="10" rx="3" fill="#313244"/>
  <rect x="190" y="190" width="22" height="10" rx="3" fill="#f9e2af"/>

  <!-- Warning accent (small dot) -->
  <circle cx="128" cy="32" r="8" fill="#f38ba8" opacity="0.8"/>
</svg>
